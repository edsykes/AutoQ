services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autoq
      POSTGRES_PASSWORD: autoq
      POSTGRES_DB: autoq
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoq -d autoq"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://autoq:autoq@db:5432/autoq
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
